name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/genshin-start
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repos/genshin-start

      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          repository: Miaoyww/Nons
          path: Nons

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          package_json_file: repos/genshin-start/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repos/genshin-start/pnpm-lock.yaml

      - name: Check tag version
        run: |
          node -e "const manifest = require('./manifest.json'); const version = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (manifest.version !== version) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' 与 manifest ' + manifest.version + ' 不一致'); process.exit(1); }"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dont-play-that-song-*.zip --title "$GITHUB_REF_NAME" --generate-notes
